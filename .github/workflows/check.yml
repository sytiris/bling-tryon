name: Check and build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: x64
          - os: windows-latest
            arch: x64
          - os: ubuntu-latest
            arch: x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: examples/ecommerce
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.14.1'
          architecture: ${{ matrix.arch }}
          cache: npm
          cache-dependency-path: examples/ecommerce/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build:release
      - name: Verify packaged native runtime
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          package_dir="../../dist/$(node -p "'bling-tryon-'+process.platform+'-'+process.arch")"
          runtime="$package_dir/runtime/node"
          if [[ "$RUNNER_OS" == "Windows" ]]; then runtime="$runtime.exe"; fi
          "$runtime" --input-type=module - "$package_dir" <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, existsSync } from 'node:fs';
          import { join } from 'node:path';
          const directory = process.argv[2];
          const info = JSON.parse(readFileSync(join(directory, 'BUILD.json'), 'utf8'));
          const manifest = JSON.parse(readFileSync(join(directory, 'chrome-tryon/manifest.json'), 'utf8'));
          assert.equal(manifest.version, info.version);
          if (process.env.GITHUB_REF_TYPE === 'tag') assert.equal(info.version, process.env.GITHUB_REF_NAME.replace(/^v/, ''));
          const notices = readFileSync(join(directory, 'chrome-tryon/THIRD_PARTY_NOTICES.txt'), 'utf8');
          assert.ok(notices.includes('aliyun-rtc-sdk 7.1.9'), 'RTC vendor notice missing');
          assert.ok(notices.includes('aliyun-rts-sdk'), 'Bundled dependency licenses missing');
          assert.equal(process.arch, process.env.EXPECTED_ARCH);
          assert.equal(process.arch.toUpperCase(), process.env.RUNNER_ARCH);
          assert.equal(info.arch, process.arch);
          assert.equal(info.platform, process.platform);
          assert.equal(info.nodeVersion, process.version);
          for (const file of ['helper/server.mjs', 'helper/public/i18n.js', 'chrome-tryon/manifest.json', 'README.md', 'README.zh-CN.md']) {
            assert.ok(existsSync(join(directory, file)), file);
          }
          console.log('Native package verified:', info.platform, info.arch, info.version);
          NODE
      - name: Archive with executable permissions
        shell: bash
        run: tar -czf ../../dist/bling-tryon-${{ runner.os }}-${{ runner.arch }}.tar.gz -C ../../dist "$(node -p "'bling-tryon-'+process.platform+'-'+process.arch")"
      - uses: actions/upload-artifact@v7
        with:
          name: bling-tryon-${{ runner.os }}-${{ runner.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Publish verified installation packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir artifacts
          mapfile -d '' archives < <(find artifacts -type f -name '*.tar.gz' -print0)
          expected=(bling-tryon-macOS-ARM64.tar.gz bling-tryon-macOS-X64.tar.gz bling-tryon-Windows-X64.tar.gz bling-tryon-Linux-X64.tar.gz)
          test "${#archives[@]}" -eq "${#expected[@]}"
          for archive in "${archives[@]}"; do cp "$archive" .; done
          for archive in "${expected[@]}"; do test -s "$archive"; done
          sha256sum bling-tryon-*.tar.gz > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" bling-tryon-*.tar.gz SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "试衣镜bling $GITHUB_REF_NAME" --notes-file .github/RELEASE_NOTES.md
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
