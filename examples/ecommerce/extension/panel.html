<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>试衣镜bling</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <main>
    <section class="stage">
      <video id="camera" autoplay muted playsinline aria-label="摄像头预览"></video>
      <video id="output" autoplay muted playsinline aria-label="AI 试穿画面"></video>
      <canvas id="snapshot" aria-label="最后一帧试穿效果"></canvas>
      <div id="placeholder"><span class="hanger">⌁</span><p>把自己放在画面中央</p></div>
      <section id="consent">
        <h1>开启摄像头？</h1>
        <p>点击试穿后才向 AI 发送画面</p>
        <button id="enable-camera" disabled>同意，开启</button>
      </section>
      <div id="loading" hidden><span class="spinner"></span><span id="loading-text">准备试穿</span></div>
      <span id="countdown" hidden></span>
      <span id="preview-tag" hidden>本机预览</span>
    </section>
    <div class="status-row"><span id="status" role="status">正在准备</span><span id="latency"></span></div>
    <p id="error" role="alert" hidden></p>
    <section id="controls" hidden>
      <button id="quick" data-seconds="10">10 秒</button>
      <button id="fine" data-seconds="20">20 秒</button>
      <button id="close-camera">关闭摄像头</button>
    </section>
  </main>
  <script type="module" src="panel.js"></script>
</body>
</html>
