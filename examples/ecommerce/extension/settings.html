<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>试衣镜bling · 设置</title><link rel="stylesheet" href="settings.css"></head>
<body><main>
<header>试衣镜 <em>bling ✧</em></header>
<h1>连接本地助手</h1>
<p>你的永久 API Key 由本地助手保管。插件只使用短期令牌。</p>
<div class="status"><span id="indicator"></span><strong id="state" role="status">正在检测…</strong><button id="retry">重新检测</button></div>
<p id="detail"></p>
<a id="open-helper" href="http://127.0.0.1:3000/setup" target="_blank" rel="noopener noreferrer" hidden>打开本机配置页 ↗</a>
<ol><li>解压完整安装包，运行「启动试衣镜bling」启动器，保持终端开启。</li><li>在本地助手页面验证并保存你自己的 Decart Key。</li><li>回到购物网页，点插件图标、选择服装，再点 10 秒 / 20 秒。</li></ol>
<footer>费用由你的 Decart 账户承担。没有启动器时，请下载包含本地助手的完整安装包。<br>部分网站限制浮窗使用摄像头，插件会显示对应提示。</footer>
</main><script type="module" src="settings.js"></script></body></html>
