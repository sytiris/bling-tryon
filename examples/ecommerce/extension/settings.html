<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n="试衣镜bling · 设置">试衣镜bling · 设置</title><link rel="stylesheet" href="settings.css"></head>
<body><main>
<header><span data-i18n="试衣镜bling">试衣镜bling</span><button id="language" type="button" title="Switch language / 切换语言">中 / EN</button></header>
<h1 data-i18n="连接本地助手">连接本地助手</h1>
<p data-i18n="你的永久 API Key 由本地助手保管。插件只使用短期令牌。">你的永久 API Key 由本地助手保管。插件只使用短期令牌。</p>
<div class="status"><span id="indicator"></span><strong id="state" role="status" data-i18n="正在检测…">正在检测…</strong><button id="retry" data-i18n="重新检测">重新检测</button></div>
<p id="detail"></p>
<a id="open-helper" href="http://127.0.0.1:3000/setup" target="_blank" rel="noopener noreferrer" hidden data-i18n="打开本机配置页 ↗">打开本机配置页 ↗</a>
<ol><li data-i18n="解压完整安装包，运行「启动试衣镜bling」启动器，保持终端开启。">解压完整安装包，运行「启动试衣镜bling」启动器，保持终端开启。</li><li data-i18n="在本地助手页面验证并保存你自己的 Decart Key。">在本地助手页面验证并保存你自己的 Decart Key。</li><li data-i18n="回到购物网页，点插件图标、选择服装，再点 10 秒 / 20 秒。">回到购物网页，点插件图标、选择服装，再点 10 秒 / 20 秒。</li></ol>
